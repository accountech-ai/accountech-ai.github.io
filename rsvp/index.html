<title>Accountech AI · אישור הגעה</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Same ground, column and tokens as checkin/index.html - keep the two in step. */
:root{
  direction:rtl;
  --ink-0:#0E061C; --wine:#4C1246;
  --lilac:#C082E2; --sky:#61A5FA; --paper:#FFFFFF;
  --mist:#D2C6E6; --dim:#9F90BC;
  --line:rgba(192,130,226,.24); --line-soft:rgba(255,255,255,.09);
  --glass:rgba(255,255,255,.055);
  --sans:"Heebo","Segoe UI",system-ui,sans-serif;
  --latin:"Poppins","Heebo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100svh; background:var(--ink-0); color:var(--mist);
  font-family:var(--sans); font-weight:300; font-size:16.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
h1,p{margin:0}

.ground{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  background:
    radial-gradient(120% 75% at 78% 0%,   #3A1550 0%, transparent 62%),
    radial-gradient(110% 70% at 10% 18%,  #241040 0%, transparent 58%),
    radial-gradient(130% 80% at 88% 74%,  var(--wine) 0%, transparent 60%),
    linear-gradient(170deg,#1B0D31 0%,#150929 46%,#1E0B2E 100%);
}
.bloom{position:absolute; border-radius:50%; filter:blur(60px); opacity:.5;
  animation:drift 34s ease-in-out infinite alternate}
.bloom.b1{width:78vw; height:78vw; max-width:640px; max-height:640px; top:-16vw; right:-22vw;
  background:radial-gradient(circle,rgba(150,74,190,.55),transparent 66%)}
.bloom.b2{width:88vw; height:88vw; max-width:700px; max-height:700px; bottom:-22vw; left:-24vw;
  background:radial-gradient(circle,rgba(97,165,250,.18),transparent 66%); animation-duration:48s; animation-delay:-12s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)} to{transform:translate3d(-4%,5%,0) scale(1.1)}}

main{position:relative; z-index:1; width:100%; max-width:480px; margin:0 auto;
  padding:clamp(34px,9vw,60px) 20px 40px; display:flex; flex-direction:column; min-height:100svh}

.disc{position:relative; width:76px; height:76px; margin-bottom:26px}
.disc::before{content:""; position:absolute; inset:-45%; border-radius:50%;
  background:radial-gradient(closest-side,rgba(156,139,240,.26),rgba(192,130,226,.08) 55%,transparent)}
.disc img{position:relative; width:100%; height:100%; display:block;
  filter:drop-shadow(0 0 14px rgba(192,130,226,.45))}

.eyebrow{font-family:var(--latin); font-size:13px; font-weight:600; letter-spacing:.04em;
  color:var(--lilac); text-transform:uppercase; margin-bottom:10px}
.eyebrow bdi{direction:ltr}
h1{font-size:clamp(32px,9vw,42px); font-weight:900; color:var(--paper);
  line-height:1.1; letter-spacing:-.025em; margin-bottom:10px; text-wrap:balance}
h1 .grad{background:linear-gradient(95deg,var(--lilac),var(--sky));
  -webkit-background-clip:text; background-clip:text; color:transparent}
.sub{font-size:17px; color:var(--mist); margin-bottom:22px; text-wrap:pretty}

/* the evening, as one quiet card */
.event{display:flex; flex-direction:column; gap:2px; padding:14px 18px; margin-bottom:22px;
  border-inline-start:2px solid var(--lilac); background:linear-gradient(90deg,transparent,rgba(192,130,226,.07))}
.event b{color:var(--paper); font-weight:700; font-size:16.5px}
.event span{font-size:14.5px; color:var(--dim)}

/* ─────────────────  form  ───────────────── */
form{display:flex; flex-direction:column; gap:14px}
.card{padding:18px; background:var(--glass); border:1px solid var(--line); border-radius:18px;
  display:flex; flex-direction:column; gap:14px}
.row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.field label{display:block; font-size:13.5px; font-weight:500; color:var(--dim); margin-bottom:6px}
.hint{font-size:12.5px; color:var(--dim); opacity:.8; margin-top:6px}
input[type=text],input[type=tel]{width:100%; font:inherit; font-size:17px; font-weight:400; color:var(--paper);
  background:rgba(255,255,255,.06); border:1px solid var(--line-soft); border-radius:12px;
  padding:13px 14px; outline:none; transition:border-color .2s, background .2s}
input[type=tel]{direction:ltr; text-align:right; font-family:var(--latin); letter-spacing:.02em}
input::placeholder{color:rgba(210,198,230,.42)}
input:focus{border-color:var(--lilac); background:rgba(255,255,255,.09)}

.legend{font-size:clamp(19px,5.4vw,22px); font-weight:800; color:var(--paper); line-height:1.3; margin:0}
.choices{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.choice{position:relative}
.choice input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.choice span{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  min-height:76px; padding:12px 10px; text-align:center; border-radius:14px;
  border:1px solid var(--line-soft); background:rgba(255,255,255,.04);
  font-size:16.5px; font-weight:700; color:var(--mist);
  transition:border-color .2s, background .2s, color .2s, transform .16s cubic-bezier(.2,.9,.3,1)}
.choice small{font-size:12.5px; font-weight:400; color:var(--dim)}
.choice input:checked + span{border-color:var(--lilac); color:var(--paper);
  background:linear-gradient(160deg,rgba(192,130,226,.22),rgba(97,165,250,.12));
  box-shadow:inset 0 0 0 1px var(--lilac)}
.choice input:active + span{transform:scale(.97)}
.choice input:focus-visible + span{outline:2px solid var(--lilac); outline-offset:3px}

.btn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
  font-family:var(--sans); font-size:17px; font-weight:800; color:#170A26;
  padding:16px 22px; margin-top:6px; border-radius:14px; border:0; cursor:pointer;
  background:linear-gradient(100deg,var(--lilac),var(--sky));
  box-shadow:0 10px 30px -10px rgba(192,130,226,.75);
  transition:transform .16s cubic-bezier(.2,.9,.3,1), opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6; cursor:default}
.btn:focus-visible,.link:focus-visible{outline:2px solid var(--lilac); outline-offset:3px}
.link{font:inherit; font-size:14px; color:var(--lilac); background:none; border:0;
  padding:6px 0; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
.err{font-size:14.5px; color:#FFB4C8; min-height:1em}
.err a{color:var(--paper)}

/* ─────────────────  done  ───────────────── */
.done{flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center;
  align-items:center; padding-bottom:12vh}
.done .disc{width:120px; height:120px; margin-bottom:30px; animation:pop .7s cubic-bezier(.2,1.4,.4,1) backwards}
.done h1{margin-bottom:12px}
.done .sub{margin-bottom:8px}
@keyframes pop{from{transform:scale(.6); opacity:0}}
.rise{animation:rise .8s cubic-bezier(.16,.84,.34,1) backwards}
@keyframes rise{from{opacity:0; transform:translateY(14px)}}
.foot{margin-top:auto; padding-top:34px; font-family:var(--latin); font-size:11px;
  letter-spacing:.18em; color:var(--dim); opacity:.7; direction:ltr; text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

    <p class="eyebrow rise" id="eyebrow"></p>
    <h1 class="rise">נתראה <span class="grad" id="h1place"></span></h1>
    <p class="sub rise" id="sub"></p>

    <div class="event rise" id="event"><b id="evSpeaker"></b><span id="evWhen"></span></div>

    <form id="f" class="rise" novalidate>
      <div class="card">
        <div class="row">
          <div class="field"><label for="first">שם פרטי</label>
            <input id="first" type="text" autocomplete="given-name" required></div>
          <div class="field"><label for="last">שם משפחה</label>
            <input id="last" type="text" autocomplete="family-name" required></div>
        </div>
        <div class="field"><label for="phone">טלפון נייד</label>
          <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="050-0000000" maxlength="16" required>
          <p class="hint" id="phoneHint"></p></div>
      </div>

      <div class="card" role="radiogroup" aria-labelledby="goingQ">
        <p class="legend" id="goingQ">מגיעים?</p>
        <div class="choices">
          <label class="choice"><input type="radio" name="going" value="מגיע/ה בוודאות"><span>בוודאות<small>שמרו לי מקום</small></span></label>
          <label class="choice"><input type="radio" name="going" value="אולי"><span>אולי<small>עוד לא בטוח/ה</small></span></label>
        </div>
      </div>

      <p class="err" id="err" role="alert"></p>
      <button class="btn" id="go" type="submit">אישור הגעה</button>
    </form>
  </section>

  <section class="done" id="done" hidden>
    <div class="disc"><img id="doneDisc" alt=""></div>
    <h1 id="doneTitle"></h1>
    <p class="sub" id="doneSub"></p>
    <button type="button" class="link" id="change">שינוי תשובה</button>
  </section>

  <p class="foot">ACCOUNTECH AI</p>
</main>

<script>
/* ── the evening ─────────────────────────────────────────────────────────
   One event per page load. To reuse the page, change EVENT and FORM (a new
   Google Form per event keeps each guest list in its own Sheet).
   time/address stay null until confirmed - the page simply leaves them out. */
const EVENT = {
  n:       5,
  date:    "2026-11-29",
  speaker: "רן מתוקי · מייסד CFO to Tech",
  place:   "EY",             // shown as "ב-EY"
  time:    null,             // e.g. "19:00"
  address: null,             // e.g. "מנחם בגין 144, תל אביב"
};

/* ── Google Form behind the page ─────────────────────────────────────────
   The page posts straight to the form's /formResponse, so answers land in its
   linked Sheet. IDs come from the form's "Get pre-filled link". */
const FORM = {
  id:    "1FAIpQLSc6kSrhW582DwsPa8zSv5GKc6woWpZ0rIglsSuQIgG183_UHQ",   // "אישור הגעה – מפגש 5 · EY"
  first: "entry.1969058051",   // שם פרטי
  last:  "entry.1736429621",   // שם משפחה
  phone: "entry.549804240",    // טלפון
  going: "entry.66582956",     // הגעה: multiple choice, options must match the radio values exactly
};

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KEY = "acc-rsvp:";
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(KEY + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} },
};

const [, mo, d] = EVENT.date.split("-");
const weekday = new Date(EVENT.date + "T12:00").toLocaleDateString("he-IL", { weekday: "long" });
const iso = s => `<bdi>${esc(s)}</bdi>`;   // keep Latin names from dragging the punctuation around
$("eyebrow").innerHTML = `מפגש <bdi>${pad(EVENT.n)}</bdi> · <bdi>${d}.${mo}</bdi> · <bdi>${EVENT.place}</bdi>`;
$("h1place").innerHTML = `ב-${iso(EVENT.place)}?`;
$("sub").innerHTML = `המפגש הבא אצל ${iso(EVENT.place)}, והכניסה לבניין רק עם אישור שמכינים מראש. חצי דקה ואתם ברשימה.`;
$("evSpeaker").textContent = EVENT.speaker;
$("evWhen").textContent = [`${weekday}, ${d}.${mo}`, EVENT.time, EVENT.address || `משרדי ${EVENT.place}`].filter(Boolean).join(" · ");
$("phoneHint").innerHTML = `רק בשביל אישור הכניסה ל-${iso(EVENT.place)}.`;
$("doneDisc").src = $("disc").src;   // one inlined copy of the disc, not two

/* 050-1234567, 0501234567, +972 50 123 4567, 972501234567 → 050-1234567 */
function normPhone(raw) {
  let p = raw.replace(/\D/g, "");
  if (p.startsWith("972")) p = "0" + p.slice(3);
  return /^05\d{8}$/.test(p) ? `${p.slice(0, 3)}-${p.slice(3)}` : null;
}

function showDone(v, again) {
  $("ask").hidden = true; $("done").hidden = false;
  const sure = v.going !== "אולי";
  $("doneTitle").innerHTML = sure
    ? `מעולה, ${esc(v.first)}. <span class="grad">נתראה ב-${iso(EVENT.place)}.</span>`
    : `רשמנו, ${esc(v.first)}. <span class="grad">נשמח לראות אותך.</span>`;
  $("doneSub").textContent = (again ? "כבר אישרת הגעה. " : "")
    + (sure ? "ניפגש שם 💜" : "נכין לך אישור כניסה בכל מקרה 💜");
}

/* returning visitor: details are prefilled, and a done answer shows straight away */
const me = store.get("me");
if (me) { $("first").value = me.first || ""; $("last").value = me.last || ""; $("phone").value = me.phone || ""; }
const prev = store.get("done:" + EVENT.n);
if (prev) {
  const r = document.querySelector(`input[name=going][value="${prev.going}"]`); if (r) r.checked = true;
  showDone(prev, true);
}
$("change").onclick = () => { $("done").hidden = true; $("ask").hidden = false; $("go").disabled = false; $("go").textContent = "עדכון תשובה"; };

function fields(v) {
  return [[FORM.first, v.first], [FORM.last, v.last], [FORM.phone, v.phone], [FORM.going, v.going]];
}
function prefillUrl(v) {
  const p = new URLSearchParams({ usp: "pp_url" });
  for (const [k, val] of fields(v)) p.set(k, val);
  return `https://docs.google.com/forms/d/e/${FORM.id}/viewform?${p}`;
}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const clean = s => s.trim().replace(/\s+/g, " ");
  const going = document.querySelector("input[name=going]:checked");
  const v = { first: clean($("first").value), last: clean($("last").value), phone: normPhone($("phone").value), going: going && going.value };
  const err = $("err"); err.textContent = "";
  if (!v.first) { err.textContent = "חסר שם פרטי."; $("first").focus(); return; }
  if (!v.last)  { err.textContent = "חסר שם משפחה."; $("last").focus(); return; }
  if (!v.phone) { err.textContent = "מספר נייד בפורמט 05X-XXXXXXX, בבקשה."; $("phone").focus(); return; }
  if (!v.going) { err.textContent = "בוודאות או אולי?"; return; }
  if (!FORM.id) { err.textContent = "הטופס עוד לא מחובר."; return; }

  const go = $("go"); go.disabled = true; go.textContent = "שולחים…";
  const body = new URLSearchParams();
  for (const [k, val] of fields(v)) body.set(k, val);
  try {
    // no-cors: Google answers with an opaque response, so a resolved fetch is the success signal
    await fetch(`https://docs.google.com/forms/d/e/${FORM.id}/formResponse`, { method: "POST", mode: "no-cors", body });
    store.set("me", { first: v.first, last: v.last, phone: v.phone });
    store.set("done:" + EVENT.n, v);
    $("phone").value = v.phone;
    showDone(v, false);
  } catch (x) {
    go.disabled = false; go.textContent = "אישור הגעה";
    err.innerHTML = `השליחה לא עברה. <a href="${prefillUrl(v)}" target="_blank" rel="noopener">שלחו מכאן ←</a>`;
  }
});
</script>

</body>
</html>
